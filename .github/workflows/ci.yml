name: CI & Visual QA

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Qt screenshots / 3 visual QA rounds
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/visual_audit.py --strict
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: namazflow-visual-qa
          path: qa-artifacts/
          if-no-files-found: warn

  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pyinstaller
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name NamazFlow main.py
      - uses: actions/upload-artifact@v4
        with:
          name: NamazFlow-Windows-unsigned
          path: dist/NamazFlow.exe
          if-no-files-found: error

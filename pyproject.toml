[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namazflow"
version = "0.2.0"
description = "Elegant always-on-top Windows prayer-times widget"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "tzdata>=2026.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
include = ["namazflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
